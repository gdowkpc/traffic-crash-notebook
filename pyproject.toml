description = "Personal traffic crash investigative working-notes application"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.12.0",
  "reportlab>=4.2,<5",
  "pyspellchecker>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
