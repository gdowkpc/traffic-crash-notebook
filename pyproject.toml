[project]
name = "traffic-crash-notebook"
version = "0.5.8"
description = "Personal traffic crash investigative working-notes application"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "reportlab>=4.2,<5",
  "pyspellchecker>=0.9,<1",
  "zxing-cpp>=3.1.1,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
