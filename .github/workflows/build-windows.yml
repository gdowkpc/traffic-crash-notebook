name: Build Windows Portable Application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Build, test, and package
        shell: powershell
        run: .\scripts\build_windows.ps1 -Clean

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.zip
            release/*.sha256.txt
            release/*.json

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: TrafficCrashNotebook-Windows-Portable
          path: |
            release/*.zip
            release/*.sha256.txt
            release/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish_github_release.ps1 -Tag "${{ github.ref_name }}"
